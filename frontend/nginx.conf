upstream inventory_service {
  server inventory:8080;
}

upstream billing_service {
  server billing:8080;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 6m;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
  }

  # The browser only needs the public product catalog. Internal stock-debit and
  # MCP routes are intentionally unreachable through the edge proxy.
  location = /inventory-api/api/products {
    rewrite ^/inventory-api/(.*)$ /$1 break;
    proxy_pass http://inventory_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ "^/inventory-api/api/products/[0-9a-fA-F-]{36}/?$" {
    rewrite ^/inventory-api/(.*)$ /$1 break;
    proxy_pass http://inventory_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Extrato de movimentacao: consulta de leitura, como o catalogo.
  location = /inventory-api/api/movements {
    rewrite ^/inventory-api/(.*)$ /$1 break;
    proxy_pass http://inventory_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /inventory-api/ {
    return 404;
  }

  location /billing-api/ {
    rewrite ^/billing-api/(.*)$ /$1 break;
    proxy_pass http://billing_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
