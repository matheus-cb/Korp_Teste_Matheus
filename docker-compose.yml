name: notaflow

services:
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_INVENTORY_PASSWORD:-inventory_dev_password}
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [inventory-data]

  billing-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD:-billing_dev_password}
    volumes:
      - billing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [billing-data]

  inventory:
    build:
      context: services/inventory
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDatabase: Host=inventory-db;Port=5432;Database=inventory;Username=inventory;Password=${POSTGRES_INVENTORY_PASSWORD:-inventory_dev_password}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:?Run scripts/setup.ps1 to generate the internal token}
      Cors__AllowedOrigins__0: http://localhost:4200
    depends_on:
      inventory-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [app, inventory-data]

  billing:
    build:
      context: services/billing
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Billing: Host=billing-db;Port=5432;Database=billing;Username=billing;Password=${POSTGRES_BILLING_PASSWORD:-billing_dev_password}
      Inventory__BaseUrl: http://inventory:8080
      Inventory__McpEndpoint: http://inventory:8080/mcp
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:?Run scripts/setup.ps1 to generate the internal token}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-5.6-luna}
      # Copiloto local. Vazio mantem AI_DISABLED; "claude-bridge" fala com a
      # ponte rodando na maquina (deploy/agent/bridge/server.js).
      AI__Provider: ${AI_PROVIDER:-}
      ClaudeBridge__BaseUrl: ${CLAUDE_BRIDGE_URL:-http://host.docker.internal:5099/}
      ClaudeBridge__Secret: ${CLAUDE_BRIDGE_SECRET:-}
      ClaudeBridge__Model: ${CLAUDE_BRIDGE_MODEL:-sonnet}
      Cors__Origins__0: http://localhost:4200
    depends_on:
      billing-db:
        condition: service_healthy
      inventory:
        condition: service_healthy
    ports:
      - "127.0.0.1:5002:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app, billing-data]

  frontend:
    build:
      context: frontend
    depends_on:
      inventory:
        condition: service_healthy
      billing:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:80"
    networks: [app]

volumes:
  inventory-data:
  billing-data:

networks:
  app:
  inventory-data:
    internal: true
  billing-data:
    internal: true
